name : CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
    contents: read
jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "maven"
      
      - name: Run test and verify build
        run: bash ./mvnw -B clean verify
  
