services:
  postgres:
    image: postgres:16-alpine
    container_name: emarket-postgres
    environment:
      POSTGRES_DB: emarket
      POSTGRES_USER: emarket
      POSTGRES_PASSWORD: emarket123
    ports:
      - "5432:5432"
    volumes:
      - emarket-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U emarket -d emarket"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: emarket-app
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/emarket
      DB_USERNAME: emarket
      DB_PASSWORD: emarket123
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-900000}
      JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION:-604800000}

volumes:
  emarket-data: